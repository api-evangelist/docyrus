aid: docyrus

name: Docyrus, Inc.

image: https://docyrus.com/images/og/v1/home.png

description: Docyrus, Inc. provides an AI-native low-code platform enabling teams to build web, mobile, and agent applications without extensive
  coding. It offers AI-driven builders for web apps, agents, mobile apps, and portals, along with a desktop app, CLI, and Chrome extension. The
  platform includes workflow automation, data infrastructure, security governance, and integration connectors, targeting enterprises and developers
  seeking rapid, scalable solutions.

